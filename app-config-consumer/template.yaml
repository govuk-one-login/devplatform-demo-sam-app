AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  AppConfig consumer app for validating the app-config-deploy-pipeline template end-to-end.

Parameters:
  ConfigPipelineStackName:
    Description: "Name of the app-config-deploy-pipeline stack whose exports this app consumes"
    Type: String

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: nodejs24.x
    Architectures:
      - x86_64

Resources:
  ConfigFunction:
    Type: AWS::Serverless::Function
    # checkov:skip=CKV_AWS_117: Lambda not inside a VPC, no inbound public traffic
    # checkov:skip=CKV_AWS_116: No DLQ required for synchronous HTTP Lambda
    # checkov:skip=CKV_AWS_173: Environment variables contain only AppConfig IDs, no sensitive data requiring KMS encryption
    # checkov:skip=CKV_AWS_115: No concurrency limit required for this test/validation Lambda
    Properties:
      CodeUri: .
      Handler: src/handler.handler
      Policies:
        - !Sub
          - "${PolicyArn}"
          - PolicyArn:
              Fn::ImportValue: !Sub "${ConfigPipelineStackName}-AppConfigClientPolicyArn"
      Environment:
        Variables:
          APP_CONFIG_APPLICATION_ID:
            Fn::ImportValue: !Sub "${ConfigPipelineStackName}-AppConfigApplicationId"
          APP_CONFIG_ENVIRONMENT_ID:
            Fn::ImportValue: !Sub "${ConfigPipelineStackName}-AppConfigEnvironmentId"
          APP_CONFIG_PROFILE_ID:
            Fn::ImportValue: !Sub "${ConfigPipelineStackName}-AppConfigProfileId"
      Events:
        GetConfig:
          Type: HttpApi
          Properties:
            Path: /config
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2024"
        EntryPoints:
          - src/handler.ts

Outputs:
  ApiEndpoint:
    Description: "GET /config endpoint URL"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/config"
