name: App config consumer deploy using Environment variables
run-name: App config consumer deploy using Environment variables to ${{ inputs.environment }}

################################ Prerequisite setup ################################
# Set the customization template for an OpenID Connect (OIDC) subject claim for the repository.
# You must authenticate using an access token with the repo scope to curl the endpoint.
#
#        curl -L \
#          -X PUT \
#          -H "Accept: application/vnd.github+json" \
#          -H "Authorization: Bearer <YOUR-TOKEN>"\
#          -H "X-GitHub-Api-Version: 2022-11-28" \
#          https://api.github.com/repos/govuk-one-login/devplatform-demo-sam-app/actions/oidc/customization/sub \
#          -d '{"use_default":false,"include_claim_keys":["repo","context","ref"]}'
#
# With the above setup, example sub from AssumeRoleWithWebIdentity as seen in Cloudtrail in build account
#        "subjectFromWebIdentityToken": "repo:govuk-one-login/devplatform-demo-sam-app:environment:build:ref:refs/heads/main",

on:
  push:
    branches:
      - main
    paths:
      - "app-config-consumer/**"
      - ".github/workflows/app-config-consumer-deploy-using-environment-variables.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run against'
        type: environment
        required: true

defaults:
  run:
    shell: bash
    working-directory: ./app-config-consumer

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Install Node.js dependencies
        uses: govuk-one-login/github-actions/node/install-dependencies@1dc99c55afa803d0e2de5499e5fb0f077ea15542
        with:
          node-version: 24
          working-directory: ./app-config-consumer
  
      - name: Build SAM application
        uses: govuk-one-login/github-actions/sam/build-application@656e1fc5c16764aadc44f9b98706b1069ebdfe7c
        with:
          aws-role-arn: ${{ vars.APP_CONFIG_CONSUMER_GH_ACTIONS_ROLE_ARN }}
          template: ./app-config-consumer/template.yaml
  
      - name: Deploy SAM app
        uses: govuk-one-login/devplatform-upload-action/sam@6677f824e2e0899e207870cfc8224858d1dd6fac #v4.4.1
        with:
          artifact-bucket-name: ${{ vars.APP_CONFIG_CONSUMER_ARTIFACT_BUCKET_NAME }}
          signing-profile-name: ${{ vars.SIGNING_PROFILE_NAME }}
          working-directory: .aws-sam/build