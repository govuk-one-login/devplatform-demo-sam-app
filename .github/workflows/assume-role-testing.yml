name: Assuming Role to validate sam deploy GHA role

on:
  push:
    branches:
      - psredev-3812-testing-trust-policies
  pull_request:

  # workflow_dispatch:
  #   inputs:
  #     environment:
  #       required: true
  #       type: choice
  #       options:
  #         - build

jobs:
  assume-role:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # environment: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Set up AWS creds
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::842766856468:role/psredev-3812-sam-GitHubActionsRole-QhtoilQ35dDe
          aws-region: eu-west-2