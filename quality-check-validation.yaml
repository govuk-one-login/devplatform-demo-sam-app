# TEMPORARY: validates the devplatform-quality-check custom check GDS_DEVPLATFORM_001.
# This intentionally grants iam:PassRole on "*", which the check must FAIL.
# Delete this file once validation is confirmed.
AWSTemplateFormatVersion: "2010-09-09"
Resources:
  QualityCheckValidationPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "iam:PassRole"
            Resource: "*"
